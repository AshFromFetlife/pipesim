description: 'A square supports three 1000 mm pipes, each with a tee at both ends. The different tee offsets require
  continuous angles rather than exact 15 degree increments. The top pipe is in the front socket: connect it through
  upper-back and then upper-left, keeping the screws loose until the frame is fitted.'
