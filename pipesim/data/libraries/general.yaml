format: pipesim-library/1
name: Materials, framing, motion and user-defined primitives
materials:
  steel-assumed:
    density_kg_m3: 7850
    youngs_modulus_pa: 200000000000.0
    poisson_ratio: 0.3
    yield_strength_pa: 250000000.0
    status: assumed-grade
    notes: Isotropic elastic model; replace with purchased tube grade and certificate.
  cast-iron:
    density_kg_m3: 7200
    youngs_modulus_pa: 170000000000.0
    poisson_ratio: 0.27
    status: approximate-elastic; fracture strength unknown
  aluminium-6063-assumed:
    density_kg_m3: 2700
    youngs_modulus_pa: 69000000000.0
    poisson_ratio: 0.33
    yield_strength_pa: 160000000.0
    status: assumed-temper
    notes: 6063 reported by MiniTec; temper and yield assumption need verification.
  hardwood-assumed:
    density_kg_m3: 650
    youngs_modulus_pa: 11000000000.0
    poisson_ratio: 0.3
    yield_strength_pa: 40000000.0
    status: assumed-longitudinal
    notes: Beam-only longitudinal approximation; grain, knots, moisture and joint splitting are unmodelled.
  plywood-assumed:
    density_kg_m3: 650
    youngs_modulus_pa: 7000000000.0
    poisson_ratio: 0.3
    status: rigid-panel-only
  polymer-assumed:
    density_kg_m3: 1240
    youngs_modulus_pa: 2000000000.0
    poisson_ratio: 0.35
    status: unrated; print anisotropy unmodelled
  rubber:
    density_kg_m3: 1100
    status: rigid contact approximation
  human-tissue:
    density_kg_m3: 1000
    status: rigid segment approximation
